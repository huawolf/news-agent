[project]
name = "news-agent"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9,<4",
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12,<5",
    "croniter>=6,<7",
    "fastapi>=0.115,<1",
    "feedparser>=6,<7",
    "markdownify>=0.11,<2",
    "mcp>=1.29,<2",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "requests>=2.34,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
news-agent = "src.main:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
